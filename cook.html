<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cook with what you have • Today's Dish</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Type what's in your kitchen and get meal ideas, with what you're missing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/diner.css">
<style>
.search-box { margin-top: 18px; max-width: 640px; margin-left: auto; margin-right: auto; }
.search-row { display: flex; gap: 10px; flex-wrap: wrap; }
.input {
  flex: 1 1 240px;
  min-width: 0;
  min-height: 50px;
  padding: 0 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--ink);
  font-family: inherit;
  font-size: 16px;
}
.search-row .btn-primary { flex: 1 1 140px; width: auto; min-height: 50px; border-radius: 12px; font-size: 16px; }
.help { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.status { margin-top: 6px; color: var(--muted); font-size: 14px; font-weight: 700; min-height: 1em; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 18px; margin-top: 20px; }
.details { display: none; }
.details.open { display: block; }
.inline-btn {
  min-height: 44px;
  padding: 0 16px;
  border-radius: 999px;
  border: 2px solid var(--btn);
  background: transparent;
  color: var(--ink);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
}
.small { color: var(--muted); font-size: 14px; }

.spinner-overlay { position: fixed; inset: 0; background: rgba(20, 12, 8, 0.45); display: none; align-items: center; justify-content: center; z-index: 9999; }
.spinner-box { background: var(--card); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--btn); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<body>
<script src="assets/common.js"></script>
<div class="spinner-overlay" id="spinnerOverlay">
  <div class="spinner-box" role="status">
    <div class="spinner"></div>
    <div class="small" id="spinnerText">Loading…</div>
  </div>
</div>
<div class="checker" aria-hidden="true"></div>

<header class="site-header">
  <a class="logo" href="./index.html">Today's Dish</a>
  <p class="tagline">One menu · Everybody eats</p>
</header>

<main class="wrap wide">
  <h1 class="page-title">Off the menu</h1>
  <p class="page-sub">Not feeling today's specials? Tell us what's in your kitchen.</p>

  <div class="card search-box">
    <div class="search-row">
      <input class="input" id="ingredientsInput" placeholder="e.g. onion, tomato, chicken" aria-label="Ingredients you have" enterkeyhint="search">
      <select class="input" id="dietSelect" aria-label="Diet">
        <option value="any" selected>Diet: Any</option>
        <option value="vegan">Diet: Vegan only</option>
        <option value="glutenfree">Diet: Gluten-free (best effort)</option>
        <option value="vegan_glutenfree">Diet: Vegan + Gluten-free (best effort)</option>
      </select>
      <button type="button" class="btn-primary" id="searchBtn" onclick="searchByIngredients()">Search</button>
    </div>
    <p class="help">Separate ingredients with commas. Results change a little each time you search.</p>
    <div class="status" id="searchStatus" aria-live="polite"></div>
  </div>

  <div id="resultsGrid" class="grid"></div>
</main>

<footer class="site-footer">
  <a href="./index.html">Today's specials</a>
  <a href="./cook.html" aria-current="page">Cook with what you have</a>
  <a href="./about.html">About</a>
  <button type="button" class="theme-btn" onclick="toggleDark()" aria-label="Toggle dark mode">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 0 1 9.5 3a7 7 0 1 0 11.5 11.5Z" fill="currentColor"/></svg>
  </button>
  <p class="footer-note">New ideas. One day at a time.</p>
</footer>

<script>
const WORKER_BASE_URL = "https://todaysdish-ingredients.mattbrianburnett.workers.dev";
const TARGET_RESULTS = 50;
const CONCURRENCY = 5;
const CANDIDATE_SAMPLE_PER_TIER = 60;

/* Utilities */
function safeText(v) {
  return (v === null || v === undefined) ? "" : String(v);
}

function normalizeImageUrl(url) {
  const u = safeText(url).trim();
  if (!u) return "";
  // Force HTTPS for mobile mixed-content safety
  return u.replace(/^http:\/\//i, "https://");
}

function setStatus(msg) {
  const el = document.getElementById("searchStatus");
  if (!el) return;
  el.innerText = msg || "";
}

function setSearching(s) {
  const b = document.getElementById("searchBtn");
  if (!b) return;
  b.disabled = s;
  b.innerText = s ? "Searching…" : "Search";
}

function showSpinner(show, text) {
  const o = document.getElementById("spinnerOverlay");
  const t = document.getElementById("spinnerText");
  if (!o || !t) return;
  if (text) t.innerText = text;
  o.style.display = show ? "flex" : "none";
}

function effortBadge(level) {
  if (level === "Quick") return '<span class="badge good">Effort: Quick</span>';
  if (level === "Medium") return '<span class="badge">Effort: Medium</span>';
  if (level === "Involved") return '<span class="badge accent">Effort: Involved</span>';
  return '';
}

function toggleDetails(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle("open");
}

function missingBucket(m) {
  if (m <= 3) return 0;
  if (m <= 6) return 1;
  if (m <= 9) return 2;
  return 3;
}

/* Crypto shuffle */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    const j = a[0] % (i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

async function runPool(items, workerFn, concurrency) {
  let i = 0;
  const workers = new Array(concurrency).fill(0).map(async () => {
    while (i < items.length) {
      const idx = i++;
      await workerFn(items[idx], idx);
    }
  });
  await Promise.all(workers);
}

/* Anti-repeat top 3 */
function makeHistoryKey(raw, diet) {
  return "todaysdish_lastTop3_" + raw.trim().toLowerCase() + "_" + diet;
}

function loadLastTop3(raw, diet) {
  try {
    const v = localStorage.getItem(makeHistoryKey(raw, diet));
    return v ? JSON.parse(v) : [];
  } catch {
    return [];
  }
}

function saveLastTop3(raw, diet, ids) {
  try {
    localStorage.setItem(makeHistoryKey(raw, diet), JSON.stringify(ids.slice(0, 3)));
  } catch {}
}

/* Render card */
function renderCard(recipe, matchedCount, requiredCount) {
  const id = safeText(recipe.id);
  const detailsId = "details-" + id;

  const missed = Array.isArray(recipe.missedIngredients) ? recipe.missedIngredients : [];
  const ingredients = Array.isArray(recipe.ingredients) ? recipe.ingredients : [];
  const steps = Array.isArray(recipe.steps) ? recipe.steps : [];

  const imgUrl = normalizeImageUrl(recipe.image);
  const proxied = imgUrl ? (WORKER_BASE_URL + "/img?u=" + encodeURIComponent(imgUrl)) : "";

  return (
    '<div class="card">' +
      '<div class="badges">' +
        '<span class="badge good">Matched inputs: ' + matchedCount + '/' + requiredCount + '</span>' +
        effortBadge(recipe.effort) +
        (recipe.category ? '<span class="badge">Category: ' + safeText(recipe.category) + '</span>' : '') +
        '<span class="badge">Used: ' + safeText(recipe.usedIngredientCount) + '</span>' +
        '<span class="badge accent">Missing: ' + safeText(recipe.missedIngredientCount) + '</span>' +
      '</div>' +
      '<h2>' + safeText(recipe.name) + '</h2>' +
      (proxied ? '<img src="' + proxied + '" alt="" loading="lazy">' : '') +
      '<button class="inline-btn" onclick="toggleDetails(\'' + detailsId + '\')">Show full recipe</button>' +
      '<div class="details" id="' + detailsId + '">' +
        '<hr class="sep">' +
        (missed.length
          ? '<h3>Missing ingredients</h3><ul>' + missed.map(m => '<li>' + safeText(m) + '</li>').join('') + '</ul>'
          : '<div class="small">Looks like you have most of what’s needed.</div>'
        ) +
        '<h3>Ingredients</h3><ul>' + ingredients.map(i => '<li>' + safeText(i) + '</li>').join('') + '</ul>' +
        '<hr class="sep">' +
        '<h3>Method</h3><ol>' + steps.map(s => '<li>' + safeText(s) + '</li>').join('') + '</ol>' +
      '</div>' +
    '</div>'
  );
}
/* Main search */
async function searchByIngredients() {
  const rawEl = document.getElementById("ingredientsInput");
  const dietEl = document.getElementById("dietSelect");
  const gridEl = document.getElementById("resultsGrid");

  if (!rawEl || !dietEl || !gridEl) {
    setStatus("Page elements missing. Please refresh.");
    return;
  }

  const raw = rawEl.value.trim();
  const diet = dietEl.value;

  gridEl.innerHTML = "";
  setStatus("");

  if (!raw) {
    setStatus("Please enter ingredients separated by commas.");
    return;
  }

  setSearching(true);
  showSpinner(true, "Finding candidates…");

  try {
    const nonce = Date.now().toString() + "-" + Math.random().toString(16).slice(2);

    const searchUrl = WORKER_BASE_URL
      + "/search?ingredients=" + encodeURIComponent(raw)
      + "&number=" + encodeURIComponent(TARGET_RESULTS)
      + "&diet=" + encodeURIComponent(diet)
      + "&nonce=" + encodeURIComponent(nonce);

    const resp = await fetch(searchUrl, { cache: "no-store" });
    const data = await resp.json();

    if (!resp.ok) {
      setStatus("Error: " + (data && data.error ? data.error : "Request failed"));
      return;
    }

    let candidates = Array.isArray(data.results) ? data.results : [];
    const requiredCount = data.requiredCount || raw.split(",").map(s => s.trim()).filter(Boolean).length;

    if (!candidates.length) {
      setStatus("No matches found. Try different ingredient words.");
      return;
    }

    shuffle(candidates);

    // Sample per tier for variety
    const tiers = new Map();
    for (const c of candidates) {
      const k = c.matchedCount || 1;
      if (!tiers.has(k)) tiers.set(k, []);
      tiers.get(k).push(c);
    }

    const tierKeys = Array.from(tiers.keys()).sort((a, b) => b - a);
    const sampled = [];
    for (const k of tierKeys) {
      const arr = tiers.get(k);
      shuffle(arr);
      sampled.push(...arr.slice(0, CANDIDATE_SAMPLE_PER_TIER));
    }

    showSpinner(true, "Fetching recipe details…");
    setStatus("Fetching details… (rotating results)");

    const accepted = [];

    await runPool(sampled, async (c) => {
      if (accepted.length >= TARGET_RESULTS) return;

      const recipeUrl = WORKER_BASE_URL
        + "/recipe?id=" + encodeURIComponent(c.id)
        + "&ingredients=" + encodeURIComponent(raw)
        + "&diet=" + encodeURIComponent(diet)
        + "&nonce=" + encodeURIComponent(nonce);

      const r = await fetch(recipeUrl, { cache: "no-store" });
      const j = await r.json();
      if (j && j.error) return;

      j._matchedCount = c.matchedCount || 1;
      j._requiredCount = c.requiredCount || requiredCount;
      accepted.push(j);

      showSpinner(true, "Building list (" + accepted.length + "/" + TARGET_RESULTS + ")…");
    }, CONCURRENCY);

    if (!accepted.length) {
      setStatus("No recipes matched that diet filter. Try Diet: Any.");
      return;
    }

    // Bucket by (matchedCount + missing bucket) then shuffle within
    const buckets = new Map();
    for (const r of accepted) {
      const key = (r._matchedCount || 1) + "|" + missingBucket(r.missedIngredientCount || 99);
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(r);
    }

    const keys = Array.from(buckets.keys()).sort((a, b) => {
      const [am, ab] = a.split("|").map(Number);
      const [bm, bb] = b.split("|").map(Number);
      if (bm !== am) return bm - am;
      return ab - bb;
    });

    let finalList = [];
    for (const k of keys) {
      const arr = buckets.get(k);
      shuffle(arr);
      for (const r of arr) {
        finalList.push(r);
        if (finalList.length >= TARGET_RESULTS) break;
      }
      if (finalList.length >= TARGET_RESULTS) break;
    }

    // Anti-repeat top 3
    const lastTop3 = loadLastTop3(raw, diet).map(String);
    if (lastTop3.length >= 1 && finalList.length >= 4) {
      const top3 = finalList.slice(0, 3);
      const rest = finalList.slice(3);

      const newTop = [];
      const pushed = [];

      for (const item of top3) {
        if (lastTop3.includes(String(item.id))) pushed.push(item);
        else newTop.push(item);
      }

      while (newTop.length < 3 && rest.length) newTop.push(rest.shift());
      finalList = newTop.concat(rest, pushed);
    }
    saveLastTop3(raw, diet, finalList.map(x => String(x.id)));

    let dietLabel = "Any";
    if (diet === "vegan") dietLabel = "Vegan only";
    if (diet === "glutenfree") dietLabel = "Gluten-free (best effort)";
    if (diet === "vegan_glutenfree") dietLabel = "Vegan + Gluten-free (best effort)";

    setStatus("Showing " + finalList.length + " ideas (Diet: " + dietLabel + ").");

    gridEl.innerHTML = finalList
      .map(r => renderCard(r, r._matchedCount || 1, r._requiredCount || requiredCount))
      .join("");

  } catch (e) {
    setStatus("Something went wrong. Please try again.");
    console.log(e);
  } finally {
    showSpinner(false);
    setSearching(false);
  }
}

// Enter key triggers search
document.getElementById("ingredientsInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") searchByIngredients();
});
</script>
</body>
</html>
