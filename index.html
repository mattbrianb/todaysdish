<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Today's Dish</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --text: #222;
  --muted: #666;
  --accent: #d9480f;
}

body.dark {
  --bg: #111;
  --card: #1c1c1c;
  --text: #f0f0f0;
  --muted: #aaa;
  --accent: #ff922b;
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: 1200px;
  padding: 20px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

h1 {
  margin: 0;
}

.date {
  color: var(--muted);
}

.toggle {
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 20px;
  background: var(--card);
  border: none;
  color: var(--text);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
  margin-top: 30px;
}

.card {
  background: var(--card);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.card img {
  width: 100%;
  border-radius: 12px;
  margin: 10px 0;
}

.card h2 span {
  color: var(--accent);
}

ul {
  padding-left: 18px;
}

li {
  margin-bottom: 6px;
}

footer {
  text-align: center;
  color: var(--muted);
  margin: 40px 0 10px;
}
</style>
</head>

<body>
<div class="container">
  <header>
    <div>
      <h1>Today's Dishes</h1>
      <div class="date" id="date"></div>
    </div>
    <button class="toggle" onclick="toggleDark()">🌙</button>
  </header>

  <div id="grid" class="grid">Loading…</div>

  <footer>New ideas. One day at a time.</footer>
</div>

<script>
function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('dark', document.body.classList.contains('dark'));
}

if (localStorage.getItem('dark') === 'true') {
  document.body.classList.add('dark');
}

fetch('today.json')
  .then(r => r.json())
  .then(data => {
    document.getElementById('date').innerText =
      new Date(data.date).toDateString();

    const render = (title, d) => `
      <div class="card">
        <h2><span>${title}</span><br>${d.name}</h2>
        <div><strong>Cook time:</strong> ${d.cookTime} min</div>
        <img src="${d.image}" altgredients</h3>
        <ul>${d.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
        <h3>Method</h3>
        <ol>${d.steps.map(s => `<li>${s}</li>`).join('')}</ol>
      </div>
    `;

    document.getElementById('grid').innerHTML =
      render('Breakfast', data.breakfast) +
      render('Lunch', data.lunch) +
      render('Dinner', data.dinner);
  });
</script>
</body>
</html>
