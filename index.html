<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Today's Dish</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --text: #222;
  --muted: #666;
  --accent: #d9480f;
  --accent2: #2f9e44;
  --border: rgba(0,0,0,0.08);
  --shadow: 0 10px 30px rgba(0,0,0,0.08);
}
body.dark {
  --bg: #0f1115;
  --card: #171a21;
  --text: #f3f4f6;
  --muted: #a0a6b2;
  --accent: #ff922b;
  --accent2: #51cf66;
  --border: rgba(255,255,255,0.08);
  --shadow: 0 12px 34px rgba(0,0,0,0.35);
}
body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}
.container {
  max-width: 1200px;
  padding: 20px;
  margin: auto;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 14px;
}
h1 { margin: 0; font-size: 28px; }
.date { color: var(--muted); margin-top: 4px; }
.actions { display: flex; gap: 10px; align-items: center; }
.toggle {
  cursor: pointer;
  padding: 8px 12px;
  border-radius: 999px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
}
.tabs { display: flex; gap: 10px; margin: 18px 0 10px; flex-wrap: wrap; }
.tab-btn {
  cursor: pointer;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
}
.tab-btn.active {
  border-color: rgba(217,72,15,0.35);
  box-shadow: 0 10px 20px rgba(217,72,15,0.10);
}
.section { display: none; }
.section.active { display: block; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 20px;
  margin-top: 18px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  box-shadow: var(--shadow);
}
.card img {
  width: 100%;
  border-radius: 12px;
  margin: 10px 0 12px;
  display: block;
}
.card h2 { margin: 0 0 8px 0; font-size: 20px; line-height: 1.25; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.badge {
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: rgba(0,0,0,0.02);
}
body.dark .badge { background: rgba(255,255,255,0.03); }
.badge.accent { color: var(--accent); border-color: rgba(217,72,15,0.25); }
.badge.good { color: var(--accent2); border-color: rgba(47,158,68,0.25); }
h3 {
  margin: 14px 0 8px 0;
  font-size: 14px;
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
ul, ol { margin: 0 0 0 18px; padding: 0; }
li { margin-bottom: 6px; }
hr.sep { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
.footer { text-align: center; color: var(--muted); margin: 26px 0 10px; font-size: 14px; }

.search-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  box-shadow: var(--shadow);
  margin-top: 16px;
}
.search-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.input {
  flex: 1;
  min-width: 260px;
  padding: 12px 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  outline: none;
}
.btn {
  cursor: pointer;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid rgba(217,72,15,0.25);
  background: rgba(217,72,15,0.10);
  color: var(--text);
  font-weight: 600;
}
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.help { margin-top: 10px; color: var(--muted); font-size: 13px; }
.small { font-size: 13px; color: var(--muted); }
.details-toggle {
  cursor: pointer;
  margin-top: 10px;
  display: inline-block;
  font-size: 13px;
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.details { display: none; margin-top: 10px; }
.details.open { display: block; }
</style>
</head>

<body>
<div class="container">
  <header>
    <div>
      <h1>Today's Dish</h1>
      <div class="date" id="date">Loading date…</div>
    </div>
    <div class="actions">
      <button class="toggle" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tab-today" onclick="showTab('today')">Today’s Dishes</button>
    <button class="tab-btn" id="tab-ingredients" onclick="showTab('ingredients')">Cook with what I have</button>
  </div>

  <div class="section active" id="section-today">
    <div id="todayGrid" class="grid">Loading today’s dishes…</div>
  </div>

  <div class="section" id="section-ingredients">
    <div class="search-box">
      <div class="search-row">
        <input class="input" id="ingredientsInput" placeholder="Enter ingredients (comma separated) e.g. chicken, rice, onion" />
      
        <select class="input" id="mealSelect" style="max-width:220px;">
          <option value="any" selected>Any</option>
          <option value="breakfast">Breakfast</option>
          <option value="dinner">Dinner</option>
        </select>
      
        <button class="btn" id="searchBtn" onclick="searchByIngredients()">Search</button>
      </div>
      <div class="help">
        Tip: use simple words (e.g. <b>chicken</b>, <b>egg</b>, <b>tomato</b>, <b>rice</b>). Commas are important.
      </div>
      <div class="small" id="searchStatus"></div>
    </div>

    <div id="resultsGrid" class="grid" style="margin-top:18px;"></div>
  </div>

  <div class="footer">New ideas. One day at a time.</div>
</div>

<script>
/* ===== DEBUG: if JS runs, this changes immediately ===== */
document.getElementById("date").innerText = "JS is running…";

/* ===== CONFIG ===== */
const WORKER_BASE_URL = "https://todaysdish-ingredients.mattbrianburnett.workers.dev";
const MAX_RESULTS = 6;

/* ===== THEME ===== */
function toggleDark() {
  document.body.classList.toggle("dark");
  localStorage.setItem("dark", document.body.classList.contains("dark"));
}
if (localStorage.getItem("dark") === "true") {
  document.body.classList.add("dark");
}

/* ===== TABS ===== */
function showTab(tab) {
  document.getElementById("tab-today").classList.toggle("active", tab === "today");
  document.getElementById("tab-ingredients").classList.toggle("active", tab === "ingredients");
  document.getElementById("section-today").classList.toggle("active", tab === "today");
  document.getElementById("section-ingredients").classList.toggle("active", tab === "ingredients");
}

/* ===== HELPERS ===== */
function safeText(v) {
  return (v === null || v === undefined) ? "" : String(v);
}

/* ===== TODAY'S DISHES RENDER ===== */
function renderTodayCard(title, d) {
  const cook = d.cookTime ? d.cookTime + " min" : "—";
  const ingredients = Array.isArray(d.ingredients) ? d.ingredients : [];
  const steps = Array.isArray(d.steps) ? d.steps : [];

  return (
    '<div class="card">' +
      '<div class="badges">' +
        '<span class="badge accent">' + safeText(title) + '</span>' +
        '<span class="badge">Cook time: ' + safeText(cook) + '</span>' +
      '</div>' +
      '<h2>' + safeText(d.name) + '</h2>' +
      (d.image ? '<img src="' + d.image + '" alt="">' : '') +
      '<h3>Ingredients</h3>' +
      '<ul>' + ingredients.map(i => '<li>' + safeText(i) + '</li>').join('') + '</ul>' +
      '<hr class="sep">' +
      '<h3>Method</h3>' +
      '<ol>' + steps.map(s => '<li>' + safeText(s) + '</li>').join('') + '</ol>' +
    '</div>'
  );
}

/* ===== LOAD TODAY.JSON ===== */
fetch("today.json")
  .then(r => r.json())
  .then(data => {
    const dt = new Date(data.date);
    document.getElementById("date").innerText = "For " + dt.toDateString();

    const html =
      renderTodayCard("Breakfast", data.breakfast) +
      renderTodayCard("Lunch", data.lunch) +
      renderTodayCard("Dinner", data.dinner);

    document.getElementById("todayGrid").innerHTML = html;
  })
  .catch((e) => {
    document.getElementById("date").innerText = "Unable to load today.json";
    document.getElementById("todayGrid").innerHTML = '<div class="card">Error loading today.json</div>';
    console.log("today.json error:", e);
  });

/* ===== INGREDIENT SEARCH ===== */
function setStatus(msg) {
  document.getElementById("searchStatus").innerText = msg || "";
}
function setSearching(isSearching) {
  const btn = document.getElementById("searchBtn");
  btn.disabled = isSearching;
  btn.innerText = isSearching ? "Searching…" : "Search";
}
function toggleDetails(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle("open");
}

function renderIdeaCard(r, idx) {
  const cook = r.cookTime ? r.cookTime + " min" : "—";
  const missed = Array.isArray(r.missedIngredients) ? r.missedIngredients : [];
  const ingredients = Array.isArray(r.ingredients) ? r.ingredients : [];
  const steps = Array.isArray(r.steps) ? r.steps : [];
  const detailsId = "details-" + idx;

  return (
    '<div class="card">' +
      '<div class="badges">' +
        '<span class="badge good">Cook time: ' + safeText(cook) + '</span>' +
        (r.usedIngredientCount !== undefined ? '<span class="badge">Used: ' + safeText(r.usedIngredientCount) + '</span>' : '') +
        (r.missedIngredientCount !== undefined ? '<span class="badge accent">Missing: ' + safeText(r.missedIngredientCount) + '</span>' : '') +
      '</div>' +
      '<h2>' + safeText(r.name) + '</h2>' +
      (r.image ? '<img src="' + r.image + '" alt="">' : '') +
      (missed.length
        ? '<h3>Missing ingredients</h3><ul>' + missed.map(m => '<li>' + safeText(m) + '</li>').join('') + '</ul>'
        : '<div class="small">Looks like you have most of what’s needed.</div>'
      ) +
      '<span class="details-toggle" onclick="toggleDetails(\'' + detailsId + '\')">Show full recipe</span>' +
      '<div class="details" id="' + detailsId + '">' +
        '<hr class="sep">' +
        '<h3>Ingredients</h3><ul>' + ingredients.map(i => '<li>' + safeText(i) + '</li>').join('') + '</ul>' +
        '<hr class="sep">' +
        '<h3>Method</h3><ol>' + steps.map(s => '<li>' + safeText(s) + '</li>').join('') + '</ol>' +
      '</div>' +
    '</div>'
  );
}

async function searchByIngredients() {
  const raw = document.getElementById("ingredientsInput").value.trim();
  document.getElementById("resultsGrid").innerHTML = "";
  setStatus("");

  if (!raw) {
    setStatus("Please enter some ingredients, separated by commas.");
    return;
  }

  setSearching(true);
  setStatus("Fetching ideas…");

  try {
    const meal = document.getElementById("mealSelect").value;
    const url = WORKER_BASE_URL + "/search?ingredients=" + encodeURIComponent(raw) + "&meal=" + encodeURIComponent(meal);
    const resp = await fetch(url);
    const data = await resp.json();

    if (!resp.ok) {
      setStatus("Error: " + (data && data.error ? data.error : "Request failed"));
      setSearching(false);
      return;
    }

    const results = Array.isArray(data.results) ? data.results.slice(0, MAX_RESULTS) : [];

    if (!results.length) {
      setStatus("No good matches found. Try fewer ingredients or simpler names.");
      setSearching(false);
      return;
    }

    setStatus("Showing " + results.length + " " + (data.meal || "any") + " ideas for: " + data.ingredients);
    document.getElementById("resultsGrid").innerHTML =
      results.map((r, i) => renderIdeaCard(r, i)).join("");

  } catch (e) {
    setStatus("Something went wrong. Please try again.");
    console.log("ingredient search error:", e);
  } finally {
    setSearching(false);
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && document.getElementById("section-ingredients").classList.contains("active")) {
    searchByIngredients();
  }
});
</script>
</body>
</html>
