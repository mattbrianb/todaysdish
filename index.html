<script>
const MEALS = [["breakfast", "Breakfast"], ["lunch", "Lunch"], ["dinner", "Dinner"]];
let today = null;

// Board space is tight, so drop filler like "How To Make" from recipe titles
function shortName(name) {
  return String(name || "").replace(/^how to (make|cook)\s+/i, "").replace(/\s+recipe$/i, "").trim();
}

// "YYYY-MM-DD" -> local Date (new Date("YYYY-MM-DD") is UTC and shows the previous day west of GMT)
function parseLocalDate(s) {
  const [y, m, d] = String(s).split("-").map(Number);
  return new Date(y, m - 1, d);
}

function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

function cookTime(d) {
  if (!d.cookTime) return "";
  const h = Math.floor(d.cookTime / 60), m = d.cookTime % 60;
  return [h ? h + " hr" : "", m ? m + " min" : ""].filter(Boolean).join(" ");
}

function renderBoard(data) {
  const date = parseLocalDate(data.date);
  const day = date.toLocaleDateString("en-GB", { weekday: "short" });
  const month = date.toLocaleDateString("en-GB", { month: "short" });
  document.getElementById("boardDate").textContent = day + " · " + date.getDate() + " · " + month;

  const board = document.getElementById("board");
  const tiles = document.getElementById("tiles");
  for (const [key, label] of MEALS) {
    const d = data[key];
    if (!d) continue;
    board.append(el("div", "board-meal", label), el("div", "board-dish", shortName(d.name)));

    // Each tile: the photo opens the recipe; its own button says "I'm eating this" in one tap
    const tile = el("div", "tile");
    tile.dataset.meal = key;
    const open = el("button", "tile-open");
    open.type = "button";
    open.setAttribute("aria-label", label + ": " + d.name + ". See recipe");
    open.onclick = () => openRecipe(key, label);
    const img = el("img");
    img.src = d.image;
    img.alt = "";
    const photo = el("span", "tile-photo");
    photo.append(img, el("span", "tile-check", "✓"));
    open.append(photo, el("span", "tile-label", label));
    if (cookTime(d)) open.append(el("span", "tile-time", cookTime(d)));
    open.append(el("span", "tile-hint", "See recipe ›"));

    const eat = el("button", "tile-eat", "I'm eating this");
    eat.type = "button";
    eat.setAttribute("aria-pressed", "false");
    eat.setAttribute("aria-label", "I'm eating today's " + label.toLowerCase());
    eat.onclick = () => toggleEating(key);

    tile.append(open, eat, el("span", "tile-count"));
    tiles.append(tile);
  }
  board.append(el("div", "board-foot", "No substitutions"), el("div", "board-next", ""));
  updateCountdown();
  setInterval(updateCountdown, 30000);
  renderEating();

  const names = MEALS.filter(([k]) => data[k]).map(([k, label]) => label + ": " + shortName(data[k].name));
  setShareText("Today's specials 🍽️ " + names.join(". ") + ". Everybody eats the same today #TodaysDish");
}

function openRecipe(key, label) {
  const d = today[key];
  const img = el("img", "sheet-img");
  img.src = d.image;
  img.alt = d.name;
  document.getElementById("recipeImgWrap").replaceChildren(img);
  document.getElementById("recipeMeal").textContent = label;
  document.getElementById("recipeName").textContent = d.name;
  const n = Array.isArray(d.ingredients) ? d.ingredients.length : 0;
  document.getElementById("recipeMeta").textContent = [cookTime(d), n ? n + " ingredients" : ""].filter(Boolean).join(" · ");

  const ing = document.getElementById("recipeIngredients");
  ing.replaceChildren(...(d.ingredients || []).map(i => el("li", "", i)));
  const steps = document.getElementById("recipeSteps");
  steps.replaceChildren(...(d.steps || []).map(s => el("li", "", s)));

  openMeal = key;
  renderEating();
  openOverlay("recipeOverlay");
}

/* Countdown: the menu changes at 00:00 GMT */
function updateCountdown() {
  const now = new Date();
  const next = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
  if (next <= now) next.setUTCDate(next.getUTCDate() + 1);
  const mins = Math.ceil((next - now) / 60000);
  const h = Math.floor(mins / 60), m = mins % 60;
  const node = document.querySelector(".board-next");
  if (node) node.textContent = "New menu in " + (h ? h + "h " + m + "m" : m + "m");
}

/* "I'm eating this" and streak, kept on this device only (no accounts) */
const EAT_KEY = "todaysdish_eating";
let openMeal = null;

function loadEating() {
  try { return JSON.parse(localStorage.getItem(EAT_KEY)) || {}; } catch (e) { return {}; }
}
function saveEating(log) {
  // Two months is plenty for a streak
  const keep = Object.keys(log).sort().slice(-60);
  try { localStorage.setItem(EAT_KEY, JSON.stringify(Object.fromEntries(keep.map(k => [k, log[k]])))); } catch (e) {}
}
function shiftDate(iso, days) {
  const d = parseLocalDate(iso);
  d.setDate(d.getDate() + days);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function streakDays(log, todayIso) {
  // Today counts once picked; until then a streak running to yesterday is still alive
  let day = (log[todayIso] || []).length ? todayIso : shiftDate(todayIso, -1);
  let n = 0;
  while ((log[day] || []).length) { n++; day = shiftDate(day, -1); }
  return n;
}

function toggleEating(meal = openMeal) {
  if (!today || !meal) return;
  const log = loadEating();
  const picks = new Set(log[today.date] || []);
  const adding = !picks.has(meal);
  if (adding) picks.add(meal); else picks.delete(meal);
  if (picks.size) log[today.date] = [...picks]; else delete log[today.date];
  saveEating(log);
  renderEating();
  sendEating(meal, adding);
  if (adding) {
    const n = streakDays(log, today.date);
    showToast(n > 1 ? "Enjoy! 🔥 " + n + "-day streak" : "Enjoy! Come back tomorrow to start a streak 🔥");
  }
}

function renderEating() {
  if (!today) return;
  const log = loadEating();
  const picks = log[today.date] || [];
  document.querySelectorAll(".tile").forEach(t => {
    const on = picks.includes(t.dataset.meal);
    t.classList.toggle("eating", on);
    const b = t.querySelector(".tile-eat");
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.textContent = on ? "✓ Eating" : "I'm eating this";
  });

  const btn = document.getElementById("eatBtn");
  const on = openMeal && picks.includes(openMeal);
  btn.setAttribute("aria-pressed", on ? "true" : "false");
  btn.textContent = on ? "✓ You're eating this" : "I'm eating this";
  document.getElementById("igTag").hidden = !on;

  const n = streakDays(log, today.date);
  const line = document.getElementById("streak");
  const labels = MEALS.filter(([k]) => picks.includes(k)).map(([, l]) => l.toLowerCase());
  if (picks.length) {
    line.textContent = (n > 1 ? "🔥 " + n + "-day streak · " : "") + "You're eating today's " + labels.join(" and ");
  } else if (n > 0) {
    line.textContent = "🔥 " + n + "-day streak. Tap I'm eating this to keep it going";
  }
  line.hidden = !picks.length && n === 0;
  renderCounts();
}

/* Shared count of everyone eating today's dishes (Cloudflare Worker + D1).
   If the counter isn't reachable the lines stay hidden and nothing else changes. */
const COUNTER_URL = "https://todaysdish-ingredients.mattbrianburnett.workers.dev/eats";
const SHOW_COUNTS_FROM = 3; // a near-empty counter reads as nobody's here
let counts = null;

function deviceId() {
  try {
    let id = localStorage.getItem("todaysdish_device");
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem("todaysdish_device", id);
    }
    return id;
  } catch (e) {
    return null;
  }
}
function takeCounts(c) {
  if (c && typeof c.people === "number" && c.day === today.date) {
    counts = c;
    renderCounts();
  }
}
function loadCounts() {
  fetch(COUNTER_URL + "?day=" + encodeURIComponent(today.date))
    .then(r => r.ok ? r.json() : null).then(takeCounts).catch(() => {});
}
function sendEating(meal, eating) {
  const device = deviceId();
  if (!device) return;
  fetch(COUNTER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ day: today.date, meal, device, eating })
  }).then(r => r.ok ? r.json() : null).then(takeCounts).catch(() => {});
}
function renderCounts() {
  const crowd = document.getElementById("crowd");
  const people = counts ? counts.people : 0;
  crowd.hidden = people < SHOW_COUNTS_FROM;
  crowd.textContent = people.toLocaleString() + " people are eating today's specials";

  document.querySelectorAll(".tile").forEach(t => {
    const n = counts ? counts[t.dataset.meal] || 0 : 0;
    const c = t.querySelector(".tile-count");
    c.textContent = n >= SHOW_COUNTS_FROM ? n.toLocaleString() + " eating" : "";
  });

  const one = document.getElementById("eatCount");
  const n = counts && openMeal ? counts[openMeal] || 0 : 0;
  one.hidden = n < SHOW_COUNTS_FROM;
  one.textContent = n.toLocaleString() + " people are eating this today";
}

// "no-cache" revalidates with the server so returning visitors never see yesterday's cached file
fetch("today.json", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    today = data;
    renderBoard(data);
    loadCounts();
  })
  .catch(() => {
    document.getElementById("boardDate").textContent = "Refresh the page to see today's specials";
  });
</script>
