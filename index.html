<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Today's Dish</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root { --bg:#f4f5f7; --card:#fff; --text:#222; --muted:#666; --accent:#d9480f; --accent2:#2f9e44; --border:rgba(0,0,0,0.08); --shadow:0 10px 30px rgba(0,0,0,0.08); }
body.dark { --bg:#0f1115; --card:#171a21; --text:#f3f4f6; --muted:#a0a6b2; --accent:#ff922b; --accent2:#51cf66; --border:rgba(255,255,255,0.08); --shadow:0 12px 34px rgba(0,0,0,0.35); }
body { color-scheme: light dark; margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
.container { max-width:1200px; padding:20px; margin:auto; }
header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:14px; }
h1 { margin:0; font-size:28px; }
.date { color:var(--muted); margin-top:4px; }
.actions { display:flex; gap:10px; align-items:center; }
.toggle { cursor:pointer; padding:8px 12px; border-radius:999px; background:var(--card); border:1px solid var(--border); color:var(--text); }
.tabs { display:flex; gap:10px; margin:18px 0 10px; flex-wrap:wrap; }
.tab-btn { cursor:pointer; padding:10px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); }
.tab-btn.active { border-color: rgba(217,72,15,0.35); box-shadow:0 10px 20px rgba(217,72,15,0.10); }
.section { display:none; } .section.active { display:block; }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px,1fr)); gap:20px; margin-top:18px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; box-shadow:var(--shadow); }
.card img { width:100%; border-radius:12px; margin:10px 0 12px; display:block; }
.card h2 { margin:0 0 8px 0; font-size:20px; line-height:1.25; }
.badges { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.badge { font-size:12px; padding:6px 10px; border-radius:999px; border:1px solid var(--border); color:var(--muted); background:rgba(0,0,0,0.02); }
body.dark .badge { background: rgba(255,255,255,0.03); }
.badge.accent { color:var(--accent); border-color:rgba(217,72,15,0.25); }
.badge.good { color:var(--accent2); border-color:rgba(47,158,68,0.25); }
h3 { margin:14px 0 8px 0; font-size:14px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.06em; }
ul, ol { margin:0 0 0 18px; padding:0; } li { margin-bottom:6px; }
hr.sep { border:none; border-top:1px solid var(--border); margin:14px 0; }
.footer { text-align:center; color:var(--muted); margin:26px 0 10px; font-size:14px; }

.search-box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:var(--shadow); margin-top:16px; }
.search-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.input { flex:1; min-width:260px; padding:12px; border-radius:12px; border:1px solid var(--border); background:transparent; color:var(--text); outline:none; }
select.input { background:var(--card); color:var(--text); min-width:260px; }
select.input option { background:var(--card); color:var(--text); }
.btn { cursor:pointer; padding:12px 14px; border-radius:12px; border:1px solid rgba(217,72,15,0.25); background:rgba(217,72,15,0.10); color:var(--text); font-weight:600; }
.btn:disabled { opacity:0.6; cursor:not-allowed; }
.help { margin-top:10px; color:var(--muted); font-size:13px; }
.small { font-size:13px; color:var(--muted); }
.inline-btn { cursor:pointer; display:inline-block; margin-top:10px; padding:10px 12px; border-radius:12px; border:1px solid rgba(217,72,15,0.25); background:rgba(217,72,15,0.10); color:var(--text); font-weight:600; }
.details { display:none; margin-top:10px; } .details.open { display:block; }

.spinner-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.35); display:none; align-items:center; justify-content:center; z-index:9999; }
.spinner-box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow); display:flex; gap:12px; align-items:center; }
.spinner { width:22px; height:22px; border-radius:50%; border:3px solid rgba(0,0,0,0.15); border-top-color:var(--accent); animation:spin 0.9s linear infinite; }
body.dark .spinner { border:3px solid rgba(255,255,255,0.15); border-top-color:var(--accent); }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<body>
<div class="spinner-overlay" id="spinnerOverlay">
  <div class="spinner-box">
    <div class="spinner"></div>
    <div class="small" id="spinnerText">Loading…</div>
  </div>
</div>

<div class="container">
  <header>
    <div>
      <h1>Today's Dish</h1>
      <div class="date" id="date">Loading date…</div>
    </div>
    <div class="actions">
      <button class="toggle" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tab-today" onclick="showTab('today')">Today’s Dishes</button>
    <button class="tab-btn" id="tab-ingredients" onclick="showTab('ingredients')">Cook with what I have</button>
  </div>

  <div class="section active" id="section-today">
    <div id="todayGrid" class="grid">Loading today’s dishes…</div>
  </div>

  <div class="section" id="section-ingredients">
    <div class="search-box">
      <div class="search-row">
        <input class="input" id="ingredientsInput" placeholder="Enter ingredients (comma separated) e.g. chicken" />
        <select class="input" id="dietSelect" style="max-width:280px;">
          <option value="any" selected>Diet: Any</option>
          <option value="vegan">Diet: Vegan only</option>
          <option value="glutenfree">Diet: Gluten-free (best effort)</option>
          <option value="vegan_glutenfree">Diet: Vegan + Gluten-free (best effort)</option>
        </select>
        <button class="btn" id="searchBtn" onclick="searchByIngredients()">Search</button>
      </div>
      <div class="help">
        Results are relevance-first but rotate each search (randomized within “missing buckets”).
      </div>
      <div class="small" id="searchStatus"></div>
    </div>

    <div id="resultsGrid" class="grid" style="margin-top:18px;"></div>
  </div>

  <div class="footer">New ideas. One day at a time.</div>
</div>

<script>
const WORKER_BASE_URL = "https://todaysdish-ingredients.mattbrianburnett.workers.dev";
const TARGET_RESULTS = 50;
const CONCURRENCY = 5;

function safeText(v) { return (v === null || v === undefined) ? "" : String(v); }

function toggleDark() {
  document.body.classList.toggle("dark");
  localStorage.setItem("dark", document.body.classList.contains("dark"));
}
if (localStorage.getItem("dark") === "true") document.body.classList.add("dark");

function showTab(tab) {
  document.getElementById("tab-today").classList.toggle("active", tab === "today");
  document.getElementById("tab-ingredients").classList.toggle("active", tab === "ingredients");
  document.getElementById("section-today").classList.toggle("active", tab === "today");
  document.getElementById("section-ingredients").classList.toggle("active", tab === "ingredients");
}

function setStatus(msg) { document.getElementById("searchStatus").innerText = msg || ""; }
function setSearching(isSearching) {
  const btn = document.getElementById("searchBtn");
  btn.disabled = isSearching;
  btn.innerText = isSearching ? "Searching…" : "Search";
}
function showSpinner(show, text) {
  const overlay = document.getElementById("spinnerOverlay");
  const t = document.getElementById("spinnerText");
  if (text) t.innerText = text;
  overlay.style.display = show ? "flex" : "none";
}

function effortBadge(level) {
  if (level === "Quick") return '<span class="badge good">Effort: Quick</span>';
  if (level === "Medium") return '<span class="badge">Effort: Medium</span>';
  if (level === "Involved") return '<span class="badge accent">Effort: Involved</span>';
  return '<span class="badge">Effort: —</span>';
}

function toggleDetails(detailsId) {
  const el = document.getElementById(detailsId);
  if (!el) return;
  el.classList.toggle("open");
}

function renderTodayCard(title, d) {
  const cook = d.cookTime ? (d.cookTime + " min") : "—";
  const ingredients = Array.isArray(d.ingredients) ? d.ingredients : [];
  const steps = Array.isArray(d.steps) ? d.steps : [];
  return (
    '<div class="card">' +
      '<div class="badges">' +
        '<span class="badge accent">' + safeText(title) + '</span>' +
        '<span class="badge">Cook time: ' + safeText(cook) + '</span>' +
      '</div>' +
      '<h2>' + safeText(d.name) + '</h2>' +
      (d.image ? '<img src="' + d.image + '" alt="">' : '') +
      '<h3>Ingredients</h3>' +
      '<ul>' + ingredients.map(i => '<li>' + safeText(i) + '</li>').join('') + '</ul>' +
      '<hr class="sep">' +
      '<h3>Method</h3>' +
      '<ol>' + steps.map(s => '<li>' + safeText(s) + '</li>').join('') + '</ol>' +
    '</div>'
  );
}

fetch("today.json")
  .then(r => r.json())
  .then(data => {
    document.getElementById("date").innerText = "For " + (new Date(data.date)).toDateString();
    document.getElementById("todayGrid").innerHTML =
      renderTodayCard("Breakfast", data.breakfast) +
      renderTodayCard("Lunch", data.lunch) +
      renderTodayCard("Dinner", data.dinner);
  })
  .catch(() => {
    document.getElementById("date").innerText = "Unable to load today.json";
    document.getElementById("todayGrid").innerHTML = '<div class="card">Error loading today.json</div>';
  });

// Strong shuffle using crypto
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    const j = a[0] % (i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

async function runPool(items, workerFn, concurrency) {
  let i = 0;
  const workers = new Array(concurrency).fill(0).map(async () => {
    while (i < items.length) {
      const idx = i++;
      await workerFn(items[idx], idx);
    }
  });
  await Promise.all(workers);
}

function missingBucket(m) {
  if (m <= 3) return 0;
  if (m <= 6) return 1;
  if (m <= 9) return 2;
  return 3;
}

function renderCard(recipe, matchedCount, requiredCount) {
  const id = safeText(recipe.id);
  const detailsId = "details-" + id;

  const missed = Array.isArray(recipe.missedIngredients) ? recipe.missedIngredients : [];
  const ingredients = Array.isArray(recipe.ingredients) ? recipe.ingredients : [];
  const steps = Array.isArray(recipe.steps) ? recipe.steps : [];

  return (
    '<div class="card">' +
      '<div class="badges">' +
        '<span class="badge good">Matched inputs: ' + matchedCount + '/' + requiredCount + '</span>' +
        effortBadge(recipe.effort) +
        '<span class="badge">Used: ' + safeText(recipe.usedIngredientCount) + '</span>' +
        '<span class="badge accent">Missing: ' + safeText(recipe.missedIngredientCount) + '</span>' +
      '</div>' +
      '<h2>' + safeText(recipe.name) + '</h2>' +
      (recipe.image ? '<img src="' + safeText(recipe.image) + '" alt="">' : '') +
      '<button class="btn" onclick="toggleDetails(\'' + detailsId + '\')">Show full recipe</button>' +
      '<div class="details" id="' + detailsId + '">' +
        '<hr class="sep">' +
        (missed.length
          ? '<h3>Missing ingredients</h3><ul>' + missed.map(m => '<li>' + safeText(m) + '</li>').join('') + '</ul>'
          : '<div class="small">Looks like you have most of what’s needed.</div>'
        ) +
        '<h3>Ingredients</h3><ul>' + ingredients.map(i => '<li>' + safeText(i) + '</li>').join('') + '</ul>' +
        '<hr class="sep">' +
        '<h3>Method</h3><ol>' + steps.map(s => '<li>' + safeText(s) + '</li>').join('') + '</ol>' +
      '</div>' +
    '</div>'
  );
}

async function searchByIngredients() {
  const raw = document.getElementById("ingredientsInput").value.trim();
  const diet = document.getElementById("dietSelect").value;

  document.getElementById("resultsGrid").innerHTML = "";
  setStatus("");

  if (!raw) {
    setStatus("Please enter ingredients separated by commas.");
    return;
  }

  setSearching(true);
  showSpinner(true, "Finding candidates…");

  try {
    const nonce = Date.now().toString() + "-" + Math.random().toString(16).slice(2);

    const searchUrl = WORKER_BASE_URL
      + "/search?ingredients=" + encodeURIComponent(raw)
      + "&number=" + encodeURIComponent(TARGET_RESULTS)
      + "&diet=" + encodeURIComponent(diet)
      + "&nonce=" + encodeURIComponent(nonce);

    const resp = await fetch(searchUrl, { cache: "no-store" });
    const data = await resp.json();

    if (!resp.ok) {
      setStatus("Error: " + (data && data.error ? data.error : "Request failed"));
      return;
    }

    let candidates = Array.isArray(data.results) ? data.results : [];
    const requiredCount = data.requiredCount || (raw.split(",").filter(Boolean).length);

    if (!candidates.length) {
      setStatus("No matches found. Try different ingredient words.");
      return;
    }

    // Shuffle candidates again client-side to avoid any upstream stability
    shuffle(candidates);

    showSpinner(true, "Fetching recipe details…");
    setStatus("Fetching details… (should rotate each search)");

    const accepted = [];

    await runPool(candidates, async (c) => {
      if (accepted.length >= TARGET_RESULTS) return;

      const recipeUrl = WORKER_BASE_URL
        + "/recipe?id=" + encodeURIComponent(c.id)
        + "&ingredients=" + encodeURIComponent(raw)
        + "&diet=" + encodeURIComponent(diet)
        + "&nonce=" + encodeURIComponent(nonce);

      const r = await fetch(recipeUrl, { cache: "no-store" });
      const j = await r.json();
      if (j && j.error) return;

      j._matchedCount = c.matchedCount || 1;
      j._requiredCount = c.requiredCount || requiredCount;

      // random tie breaker
      j._rand = Math.random();

      accepted.push(j);
      showSpinner(true, "Building list (" + accepted.length + "/" + TARGET_RESULTS + ")…");
    }, CONCURRENCY);

    if (!accepted.length) {
      setStatus("No recipes matched that diet filter. Try Diet: Any.");
      return;
    }

    // Relevance first, then missing bucket, then randomize within bucket
    const buckets = new Map(); // key = matchedCount + "|" + bucket
    for (const r of accepted) {
      const k = (r._matchedCount || 1) + "|" + missingBucket(r.missedIngredientCount || 99);
      if (!buckets.has(k)) buckets.set(k, []);
      buckets.get(k).push(r);
    }

    const keys = Array.from(buckets.keys()).sort((a, b) => {
      const [am, ab] = a.split("|").map(Number);
      const [bm, bb] = b.split("|").map(Number);
      if (bm !== am) return bm - am;     // matchedCount desc
      return ab - bb;                   // missing bucket asc
    });

    const finalList = [];
    for (const k of keys) {
      const arr = buckets.get(k);
      shuffle(arr); // ✅ makes top rotate
      for (const r of arr) {
        finalList.push(r);
        if (finalList.length >= TARGET_RESULTS) break;
      }
      if (finalList.length >= TARGET_RESULTS) break;
    }

    let dietLabel = "Any";
    if (diet === "vegan") dietLabel = "Vegan only";
    if (diet === "glutenfree") dietLabel = "Gluten-free (best effort)";
    if (diet === "vegan_glutenfree") dietLabel = "Vegan + Gluten-free (best effort)";

    setStatus("Showing " + finalList.length + " ideas (Diet: " + dietLabel + "). Rotated each search.");

    document.getElementById("resultsGrid").innerHTML =
      finalList.map(r => renderCard(r, r._matchedCount || 1, r._requiredCount || requiredCount)).join("");

  } catch (e) {
    setStatus("Something went wrong. Please try again.");
    console.log("search error:", e);
  } finally {
    showSpinner(false);
    setSearching(false);
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && document.getElementById("section-ingredients").classList.contains("active")) {
    searchByIngredients();
  }
});
</script>
</body>
</html>
