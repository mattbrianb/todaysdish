<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Today's Dish</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="One breakfast, one lunch and one dinner. Everybody eats the same three meals today.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/diner.css">
</head>

<body>
<script src="assets/common.js"></script>
<div class="checker" aria-hidden="true"></div>

<header class="site-header">
  <a class="logo" href="./index.html">Today's Dish</a>
  <p class="tagline">One menu · Everybody eats</p>
</header>

<main class="wrap">
  <section class="board-frame" aria-label="Today's specials">
    <div class="board" id="board" aria-live="polite">
      <div class="board-title">Today's specials</div>
      <div class="board-date" id="boardDate">· · ·</div>
    </div>
  </section>

  <div class="tiles" id="tiles"></div>

  <div class="actions-col">
    <button type="button" class="btn-primary" onclick="openShareModal()">Tell your table</button>
    <a class="text-link" href="./cook.html">Off the menu: cook with what you have</a>
  </div>
</main>

<footer class="site-footer">
  <a href="./index.html" aria-current="page">Today's specials</a>
  <a href="./cook.html">Cook with what you have</a>
  <a href="./about.html">About</a>
  <button type="button" class="theme-btn" onclick="toggleDark()" aria-label="Toggle dark mode">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 0 1 9.5 3a7 7 0 1 0 11.5 11.5Z" fill="currentColor"/></svg>
  </button>
  <p class="footer-note">New ideas. One day at a time.</p>
</footer>

<!-- Recipe sheet, filled when a photo is tapped -->
<div class="overlay" id="recipeOverlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="recipeName">
    <div class="sheet-head">
      <div class="sheet-title">Today's recipe</div>
      <button type="button" class="close-btn" onclick="closeOverlay('recipeOverlay')" aria-label="Close">✕</button>
    </div>
    <div id="recipeImgWrap"></div>
    <p class="sheet-meal" id="recipeMeal"></p>
    <h2 class="sheet-name" id="recipeName"></h2>
    <p class="sheet-meta" id="recipeMeta"></p>
    <h3>Ingredients</h3>
    <ul id="recipeIngredients"></ul>
    <h3>Method</h3>
    <ol id="recipeSteps"></ol>
  </div>
</div>

<script>
const MEALS = [["breakfast", "Breakfast"], ["lunch", "Lunch"], ["dinner", "Dinner"]];
let today = null;

// Board space is tight, so drop filler like "How To Make" from recipe titles
function shortName(name) {
  return String(name || "").replace(/^how to (make|cook)\s+/i, "").replace(/\s+recipe$/i, "").trim();
}

// "YYYY-MM-DD" -> local Date (new Date("YYYY-MM-DD") is UTC and shows the previous day west of GMT)
function parseLocalDate(s) {
  const [y, m, d] = String(s).split("-").map(Number);
  return new Date(y, m - 1, d);
}

function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

function cookTime(d) {
  return d.cookTime ? d.cookTime + " min" : "";
}

function renderBoard(data) {
  const date = parseLocalDate(data.date);
  const day = date.toLocaleDateString("en-GB", { weekday: "short" });
  const month = date.toLocaleDateString("en-GB", { month: "short" });
  document.getElementById("boardDate").textContent = day + " · " + date.getDate() + " · " + month;

  const board = document.getElementById("board");
  const tiles = document.getElementById("tiles");
  for (const [key, label] of MEALS) {
    const d = data[key];
    if (!d) continue;
    board.append(el("div", "board-meal", label), el("div", "board-dish", shortName(d.name)));

    const tile = el("button", "tile");
    tile.type = "button";
    tile.setAttribute("aria-label", label + ": " + d.name + ". See recipe");
    tile.onclick = () => openRecipe(key, label);
    const img = el("img");
    img.src = d.image;
    img.alt = "";
    tile.append(img, el("span", "tile-label", label));
    if (cookTime(d)) tile.append(el("span", "tile-time", cookTime(d)));
    tile.append(el("span", "tile-hint", "See recipe"));
    tiles.append(tile);
  }
  board.append(el("div", "board-foot", "No substitutions"));

  const names = MEALS.filter(([k]) => data[k]).map(([k, label]) => label + ": " + shortName(data[k].name));
  setShareText("Today's specials 🍽️ " + names.join(". ") + ". Everybody eats the same today:");
}

function openRecipe(key, label) {
  const d = today[key];
  const img = el("img", "sheet-img");
  img.src = d.image;
  img.alt = d.name;
  document.getElementById("recipeImgWrap").replaceChildren(img);
  document.getElementById("recipeMeal").textContent = label;
  document.getElementById("recipeName").textContent = d.name;
  const n = Array.isArray(d.ingredients) ? d.ingredients.length : 0;
  document.getElementById("recipeMeta").textContent = [cookTime(d), n ? n + " ingredients" : ""].filter(Boolean).join(" · ");

  const ing = document.getElementById("recipeIngredients");
  ing.replaceChildren(...(d.ingredients || []).map(i => el("li", "", i)));
  const steps = document.getElementById("recipeSteps");
  steps.replaceChildren(...(d.steps || []).map(s => el("li", "", s)));

  openOverlay("recipeOverlay");
}

// "no-cache" revalidates with the server so returning visitors never see yesterday's cached file
fetch("today.json", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => { today = data; renderBoard(data); })
  .catch(() => {
    document.getElementById("boardDate").textContent = "Refresh the page to see today's specials";
  });
</script>
</body>
</html>
