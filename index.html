<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Today's Dish</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --text: #222;
  --muted: #666;
  --accent: #d9480f;
  --accent2: #2f9e44;
  --border: rgba(0,0,0,0.08);
  --shadow: 0 10px 30px rgba(0,0,0,0.08);
}

body.dark {
  --bg: #0f1115;
  --card: #171a21;
  --text: #f3f4f6;
  --muted: #a0a6b2;
  --accent: #ff922b;
  --accent2: #51cf66;
  --border: rgba(255,255,255,0.08);
  --shadow: 0 12px 34px rgba(0,0,0,0.35);
}

/* Helps browsers choose correct native form colours */
body { color-scheme: light dark; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: 1200px;
  padding: 20px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 14px;
}

h1 { margin: 0; font-size: 28px; }
.date { color: var(--muted); margin-top: 4px; }

.actions { display: flex; gap: 10px; align-items: center; }

.toggle {
  cursor: pointer;
  padding: 8px 12px;
  border-radius: 999px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
}

.tabs {
  display: flex;
  gap: 10px;
  margin: 18px 0 10px;
  flex-wrap: wrap;
}

.tab-btn {
  cursor: pointer;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
}

.tab-btn.active {
  border-color: rgba(217,72,15,0.35);
  box-shadow: 0 10px 20px rgba(217,72,15,0.10);
}

.section { display: none; }
.section.active { display: block; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 20px;
  margin-top: 18px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  box-shadow: var(--shadow);
}

.card img {
  width: 100%;
  border-radius: 12px;
  margin: 10px 0 12px;
  display: block;
}

.card h2 { margin: 0 0 8px 0; font-size: 20px; line-height: 1.25; }

.badges {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.badge {
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: rgba(0,0,0,0.02);
}

body.dark .badge { background: rgba(255,255,255,0.03); }

.badge.accent { color: var(--accent); border-color: rgba(217,72,15,0.25); }
.badge.good { color: var(--accent2); border-color: rgba(47,158,68,0.25); }

h3 {
  margin: 14px 0 8px 0;
  font-size: 14px;
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

ul, ol { margin: 0 0 0 18px; padding: 0; }
li { margin-bottom: 6px; }

hr.sep {
  border: none;
  border-top: 1px solid var(--border);
  margin: 14px 0;
}

.footer {
  text-align: center;
  color: var(--muted);
  margin: 26px 0 10px;
  font-size: 14px;
}

/* Ingredient search UI */
.search-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  box-shadow: var(--shadow);
  margin-top: 16px;
}

.search-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.input {
  flex: 1;
  min-width: 260px;
  padding: 12px 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  outline: none;
}

/* Dropdown readability */
select.input {
  background: var(--card);
  color: var(--text);
  min-width: 260px;
}

select.input option {
  background: var(--card);
  color: var(--text);
}

.btn {
  cursor: pointer;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid rgba(217,72,15,0.25);
  background: rgba(217,72,15,0.10);
  color: var(--text);
  font-weight: 600;
}

.btn:disabled { opacity: 0.6; cursor: not-allowed; }

.help { margin-top: 10px; color: var(--muted); font-size: 13px; }
.small { font-size: 13px; color: var(--muted); }

.details-toggle {
  cursor: pointer;
  margin-top: 10px;
  display: inline-block;
  font-size: 13px;
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.details {
  display: none;
  margin-top: 10px;
}

.details.open {
  display: block;
}

.inline-btn {
  cursor: pointer;
  display: inline-block;
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid rgba(217,72,15,0.25);
  background: rgba(217,72,15,0.10);
  color: var(--text);
  font-weight: 600;
}
</style>
</head>

<body>
<div class="container">
  <header>
    <div>
      <h1>Today's Dish</h1>
      <div class="date" id="date">Loading date…</div>
    </div>
    <div class="actions">
      <button class="toggle" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tab-today" onclick="showTab('today')">Today’s Dishes</button>
    <button class="tab-btn" id="tab-ingredients" onclick="showTab('ingredients')">Cook with what I have</button>
  </div>

  <!-- TODAY -->
  <div class="section active" id="section-today">
    <div id="todayGrid" class="grid">Loading today’s dishes…</div>
  </div>

  <!-- INGREDIENT SEARCH -->
  <div class="section" id="section-ingredients">
    <div class="search-box">
      <div class="search-row">
        <input class="input" id="ingredientsInput" placeholder="Enter ingredients (comma separated) e.g. egg, tomato, bacon" />

        <select class="input" id="dietSelect" style="max-width:280px;">
          <option value="any" selected>Diet: Any</option>
          <option value="vegan">Diet: Vegan only</option>
          <option value="glutenfree">Diet: Gluten-free (best effort)</option>
          <option value="vegan_glutenfree">Diet: Vegan + Gluten-free (best effort)</option>
        </select>

        <button class="btn" id="searchBtn" onclick="searchByIngredients()">Search</button>
      </div>

      <div class="help">
        Tip: use simple words (e.g. <b>egg</b>, <b>tomato</b>, <b>bacon</b>). Commas are important.
      </div>

      <div class="small" id="searchStatus"></div>
    </div>

    <div id="resultsGrid" class="grid" style="margin-top:18px;"></div>
  </div>

  <div class="footer">New ideas. One day at a time.</div>
</div>

<script>
/* ===== CONFIG ===== */
const WORKER_BASE_URL = "https://todaysdish-ingredients.mattbrianburnett.workers.dev";
const DEFAULT_RESULTS = 50;

/* ===== STATE (browser memory cache) ===== */
let currentSearchIngredients = "";
let currentSearchDiet = "any";
const recipeCache = new Map(); // id -> full recipe object
const recipeLoadState = new Map(); // id -> "loading"|"loaded"

/* ===== THEME ===== */
function toggleDark() {
  document.body.classList.toggle("dark");
  localStorage.setItem("dark", document.body.classList.contains("dark"));
}
if (localStorage.getItem("dark") === "true") {
  document.body.classList.add("dark");
}

/* ===== TABS ===== */
function showTab(tab) {
  document.getElementById("tab-today").classList.toggle("active", tab === "today");
  document.getElementById("tab-ingredients").classList.toggle("active", tab === "ingredients");
  document.getElementById("section-today").classList.toggle("active", tab === "today");
  document.getElementById("section-ingredients").classList.toggle("active", tab === "ingredients");
}

/* ===== HELPERS ===== */
function safeText(v) {
  return (v === null || v === undefined) ? "" : String(v);
}

function effortBadge(level) {
  if (level === "Quick") return '<span class="badge good">Effort: Quick</span>';
  if (level === "Medium") return '<span class="badge">Effort: Medium</span>';
  if (level === "Involved") return '<span class="badge accent">Effort: Involved</span>';
  return '<span class="badge">Effort: —</span>';
}

function setStatus(msg) {
  document.getElementById("searchStatus").innerText = msg || "";
}

function setSearching(isSearching) {
  const btn = document.getElementById("searchBtn");
  btn.disabled = isSearching;
  btn.innerText = isSearching ? "Searching…" : "Search";
}

/* ===== TODAY'S DISHES RENDER ===== */
function renderTodayCard(title, d) {
  const cook = d.cookTime ? (d.cookTime + " min") : "—";
  const ingredients = Array.isArray(d.ingredients) ? d.ingredients : [];
  const steps = Array.isArray(d.steps) ? d.steps : [];

  return (
    '<div class="card">' +
      '<div class="badges">' +
        '<span class="badge accent">' + safeText(title) + '</span>' +
        '<span class="badge">Cook time: ' + safeText(cook) + '</span>' +
      '</div>' +
      '<h2>' + safeText(d.name) + '</h2>' +
      (d.image ? '<img src="' + d.image + '" alt="">' : '') +
      '<h3>Ingredients</h3>' +
      '<ul>' + ingredients.map(i => '<li>' + safeText(i) + '</li>').join('') + '</ul>' +
      '<hr class="sep">' +
      '<h3>Method</h3>' +
      '<ol>' + steps.map(s => '<li>' + safeText(s) + '</li>').join('') + '</ol>' +
    '</div>'
  );
}

fetch("today.json")
  .then(r => r.json())
  .then(data => {
    const dt = new Date(data.date);
    document.getElementById("date").innerText = "For " + dt.toDateString();

    const html =
      renderTodayCard("Breakfast", data.breakfast) +
      renderTodayCard("Lunch", data.lunch) +
      renderTodayCard("Dinner", data.dinner);

    document.getElementById("todayGrid").innerHTML = html;
  })
  .catch((e) => {
    document.getElementById("date").innerText = "Unable to load today.json";
    document.getElementById("todayGrid").innerHTML = '<div class="card">Error loading today.json</div>';
    console.log("today.json error:", e);
  });

/* ===== SEARCH LIST VIEW ===== */
function renderSearchCard(item, idx) {
  const id = safeText(item.id);
  const title = safeText(item.name);
  const img = safeText(item.image);
  const hits = (item.hits !== undefined) ? safeText(item.hits) : "0";

  const detailsId = "details-" + id;

  return (
    '<div class="card">' +
      '<div class="badges">' +
        '<span class="badge good">Matched ingredients: ' + hits + '</span>' +
      '</div>' +
      '<h2>' + title + '</h2>' +
      (img ? '<img src="' + img + '" alt="">' : '') +
      '<button class="inline-btn" onclick="toggleRecipe(\'' + id + '\')">Show full recipe</button>' +
      '<div class="details" id="' + detailsId + '"></div>' +
    '</div>'
  );
}

async function searchByIngredients() {
  const raw = document.getElementById("ingredientsInput").value.trim();
  const diet = document.getElementById("dietSelect").value;

  document.getElementById("resultsGrid").innerHTML = "";
  setStatus("");

  if (!raw) {
    setStatus("Please enter some ingredients, separated by commas.");
    return;
  }

  currentSearchIngredients = raw;
  currentSearchDiet = diet;

  setSearching(true);
  setStatus("Fetching ideas…");

  try {
    const url = WORKER_BASE_URL
      + "/search?ingredients=" + encodeURIComponent(raw)
      + "&number=" + encodeURIComponent(DEFAULT_RESULTS)
      + "&diet=" + encodeURIComponent(diet);

    const resp = await fetch(url);
    const data = await resp.json();

    if (!resp.ok) {
      setStatus("Error: " + (data && data.error ? data.error : "Request failed"));
      return;
    }

    const results = Array.isArray(data.results) ? data.results : [];
    if (!results.length) {
      setStatus("No matches found. Try fewer ingredients or simpler names.");
      return;
    }

    let dietLabel = "Any";
    if (diet === "vegan") dietLabel = "Vegan only";
    if (diet === "glutenfree") dietLabel = "Gluten-free (best effort)";
    if (diet === "vegan_glutenfree") dietLabel = "Vegan + Gluten-free (best effort)";

    setStatus(
      "Showing " + results.length +
      " ideas (Diet: " + dietLabel + "). Click ‘Show full recipe’ to expand."
    );

    document.getElementById("resultsGrid").innerHTML =
      results.map((r, i) => renderSearchCard(r, i)).join("");

  } catch (e) {
    setStatus("Something went wrong. Please try again.");
    console.log("search error:", e);
  } finally {
    setSearching(false);
  }
}

/* ===== RECIPE EXPAND (details on demand) ===== */
function renderRecipeDetails(r) {
  const ingredients = Array.isArray(r.ingredients) ? r.ingredients : [];
  const steps = Array.isArray(r.steps) ? r.steps : [];
  const missed = Array.isArray(r.missedIngredients) ? r.missedIngredients : [];

  return (
    '<hr class="sep">' +
    '<div class="badges">' +
      effortBadge(r.effort) +
      (r.usedIngredientCount !== undefined ? '<span class="badge">Used: ' + safeText(r.usedIngredientCount) + '</span>' : '') +
      (r.missedIngredientCount !== undefined ? '<span class="badge accent">Missing: ' + safeText(r.missedIngredientCount) + '</span>' : '') +
    '</div>' +
    (missed.length
      ? '<h3>Missing ingredients</h3><ul>' + missed.map(m => '<li>' + safeText(m) + '</li>').join('') + '</ul>'
      : '<div class="small">Looks like you have most of what’s needed.</div>'
    ) +
    '<h3>Ingredients</h3><ul>' + ingredients.map(i => '<li>' + safeText(i) + '</li>').join('') + '</ul>' +
    '<hr class="sep">' +
    '<h3>Method</h3><ol>' + steps.map(s => '<li>' + safeText(s) + '</li>').join('') + '</ol>'
  );
}

async function toggleRecipe(id) {
  const detailsEl = document.getElementById("details-" + id);
  if (!detailsEl) return;

  // Toggle if already loaded
  if (recipeCache.has(id)) {
    detailsEl.classList.toggle("open");
    if (detailsEl.classList.contains("open")) {
      detailsEl.innerHTML = renderRecipeDetails(recipeCache.get(id));
    } else {
      detailsEl.innerHTML = "";
    }
    return;
  }

  // Prevent double loading
  if (recipeLoadState.get(id) === "loading") return;
  recipeLoadState.set(id, "loading");

  detailsEl.classList.add("open");
  detailsEl.innerHTML = '<div class="small">Loading recipe…</div>';

  try {
    const url = WORKER_BASE_URL
      + "/recipe?id=" + encodeURIComponent(id)
      + "&ingredients=" + encodeURIComponent(currentSearchIngredients)
      + "&diet=" + encodeURIComponent(currentSearchDiet);

    const resp = await fetch(url);
    const data = await resp.json();

    // Special case: diet exclusion returns {error:"Excluded by diet filter"} with 200 in our worker
    if (data && data.error) {
      detailsEl.innerHTML = '<div class="small">This recipe was excluded by the selected diet filter.</div>';
      recipeLoadState.set(id, "loaded");
      return;
    }

    recipeCache.set(id, data);
    recipeLoadState.set(id, "loaded");
    detailsEl.innerHTML = renderRecipeDetails(data);

  } catch (e) {
    detailsEl.innerHTML = '<div class="small">Failed to load recipe details. Please try again.</div>';
    console.log("recipe error:", e);
  }
}

// Enter key triggers search when on ingredients tab
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && document.getElementById("section-ingredients").classList.contains("active")) {
    searchByIngredients();
  }
});
</script>
</body>
</html>
